name: CI

# Every push and pull request runs the same unit suite the release job runs, so
# a broken routing table, resource or guide payload fails before a tag exists.
# The integration tests need a real Aseprite and skip themselves; the
# resource-compliance eval runs here.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the GTK4 + WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # main.go embeds all:frontend/dist, so the root package does not compile
      # until the frontend has been built.
      - name: Build the frontend
        run: npm run build
        working-directory: frontend

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # The same eval ./... just ran, verbose so the routing count and payload
      # size stay in the job log on success as well as failure.
      - name: Resource-compliance eval
        run: go test -count=1 -v ./internal/mcpserver -run TestGuideCompliance
