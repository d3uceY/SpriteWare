<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>SpriteWare</title>
</head>
<body>
<!-- Elm renders into #app. Nothing else here is hand-written HTML. -->
<div id="app"></div>

<!-- elm make output: a classic script that assigns window.Elm. It must load
     BEFORE the module below, and as a plain <script> - importing it as a module
     leaves `this` undefined and the app never mounts. -->
<script src="/elm.js"></script>
<script>
  // If the bridge dies before Elm mounts, the window is a blank page with no
  // clue. Put the reason in the title and on the page instead.
  window.addEventListener("error", function (e) {
    document.title = "ERR " + e.message;
    document.body.style.color = "#000";
    document.body.textContent = "ERR " + e.message + " @ " + (e.filename || "");
  });
  window.addEventListener("unhandledrejection", function (e) {
    document.title = "REJ " + e.reason;
  });
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
